plugins {
  id "idea"
  id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
  id "io.github.hs-teams.pygradle" version "0.0.23"
}

configurations {
    src
}

def sourceRoot = "${rootDir}/src"
def buildDirPath = "${project.projectDir}/build"

pyGradle {
  sourceRoot = sourceRoot
  application = "${sourceRoot}/main/rpg_game/__main__.py"
  versionFile = "${sourceRoot}/main/rpg_game/.version"
  pythonPath = "${sourceRoot}/main:${sourceRoot}/test"
}

idea {
  module {
    settings {
      rootModuleType = 'PYTHON_MODULE'
    }
    sourceDirs += file('src/main')
    sourceDirs += file('src/demo')
    sourceDirs += file('src/webapp')
    testSourceDirs += file('src/test')
    excludeDirs += file('.idea')
    excludeDirs += file('.vscode')
    excludeDirs += file('.gradle')
    excludeDirs += file(buildDirPath)
  }
}
